openapi: 3.0.3
info:
  title: Upload API Contract
  version: 1.0.0
paths:
  /api/uploads:
    post:
      summary: Upload a file for product or banner assets
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  enum: [product-image, banner-image, other]
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadDto'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      x-authentication: required
      x-authorization: admin
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UploadDto:
      type: object
      required:
        - fileName
        - url
        - contentType
        - size
      properties:
        fileName:
          type: string
          description: Original uploaded file name
        url:
          type: string
          format: uri
          description: Publicly accessible file URL
        contentType:
          type: string
          description: MIME type of uploaded file
        size:
          type: integer
          minimum: 0
          description: File size in bytes
        purpose:
          type: string
          enum: [product-image, banner-image, other]
          description: Upload purpose category
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
